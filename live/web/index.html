<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoEDO Live</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316161c'/><text x='32' y='27' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='19' font-weight='700' fill='%23cfccc0' text-anchor='middle'>Auto</text><text x='32' y='52' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='19' font-weight='700' fill='%23ffb454' text-anchor='middle'>EDO</text></svg>">
<style>
  :root {
    --bg: #101014; --panel: #1a1a22; --panel2: #22222c; --line: #2e2e3a;
    --text: #e8e8ee; --dim: #9a9aa8;
    /* Semantic map (spec §8): amber = live correction only; gold = root;
       bone = lit/quiet; darkened = unlit; teal = JI; red = problem. */
    --amber: #ffb454; --gold: #c9a227; --gold-dim: #8a7020;
    --bone: #cfccc0; --teal: #4fd1c5; --danger: #e06060; --ok: #6fd08c;
    --keyw: #e6e3d8; --keyb: #23232b;
    /* harmony voice colors (Xentar ghost convention; V1 pink is canonical) */
    --v1: #f185a0; --v2: #b892ff; --v3: #64d8e8; --v4: #a6e05a; --v5: #7f9cf5;
  }
  * { box-sizing: border-box; }
  /* `hidden` must beat any display rule below (flex/grid containers would
     otherwise ignore it — this bit us three times). */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 18px 16px 40px;
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  /* v1.1: no card chrome — sections separate by whitespace alone */
  .band { margin-bottom: 14px; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--bone); }
  button.on { background: var(--bone); color: #17171c; border-color: var(--bone); font-weight: 600; }
  button.ghost { background: none; border-color: transparent; color: var(--dim); }
  button.ghost:hover { color: var(--text); border-color: var(--line); }
  select, input[type=text], input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 8px; font-size: 13px;
  }
  input[type=range] { accent-color: var(--bone); }
  .num { text-align: center; font-variant-numeric: tabular-nums; }
  .tab { font-variant-numeric: tabular-nums; }
  .dimtxt { color: var(--dim); }
  .bad { color: var(--danger); font-weight: 600; }
  /* ── header ─────────────────────────────────────────────────────────── */
  #header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; white-space: nowrap; }
  #header h1 .live { color: var(--amber); }
  #statusbtn { display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); flex: none; }
  .dot.ok { background: var(--ok); }
  #header .spacer { flex: 1; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  /* ── tuning + live line ─────────────────────────────────────────────── */
  #tuneline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #tuneline .dotsep { color: var(--line); }
  #root-cents, #a4 { width: 64px; }
  #readout { margin-left: auto; font-size: 14px; white-space: nowrap; }
  #readout .in  { color: var(--text); }
  #readout .tgt { color: var(--amber); font-weight: 600; }
  #readout.unvoiced { color: var(--dim); opacity: .4; }
  #readout.unvoiced .in, #readout.unvoiced .tgt { color: var(--dim); font-weight: 400; }
  /* ── ruler ──────────────────────────────────────────────────────────── */
  #ruler {
    position: relative; user-select: none; -webkit-user-select: none;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    background: #15151b; touch-action: none; margin-top: 8px;
  }
  .lane { position: relative; width: 100%; }
  #lane-piano { height: 32px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #lane-ji    { height: 16px; border-bottom: 1px solid var(--line); }
  #lane-deg   { height: 52px; cursor: pointer; }
  #lane-axis  { height: 15px; border-top: 1px solid var(--line); }
  body.perform #lane-deg { height: 84px; }
  body.perform #lane-piano { height: 44px; }
  .pkey { position: absolute; top: 0; bottom: 0; border-right: 1px solid #00000055;
          font-size: 10px; color: #55524a; display: flex; align-items: flex-end;
          justify-content: center; padding-bottom: 1px; overflow: hidden; }
  .pkey.black { background: var(--keyb); color: #8a8a96; }
  .pkey.white { background: var(--keyw); }
  .gridline { position: absolute; top: 0; bottom: 0; width: 1px;
              background: #ffffff12; pointer-events: none; }
  .jitick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--teal); }
  .jilabel { position: absolute; top: 0; font-size: 9px; color: var(--teal);
             transform: translateX(-50%); white-space: nowrap; }
  .lug { position: absolute; top: 8px; bottom: 8px; border-radius: 4px;
         background: var(--bone); border: 1px solid #00000040;
         display: flex; align-items: center; justify-content: center;
         font-size: 11px; color: #17171c; font-variant-numeric: tabular-nums;
         overflow: visible; pointer-events: none; }
  .lug.off  { background: #2c2c35; color: transparent; border-color: #00000030; }
  .lug.root { background: var(--gold); color: #171204; font-weight: 700; }
  .lug.root.off { background: var(--gold-dim); color: transparent; }
  .lug.active { background: var(--amber); color: #201500;
                box-shadow: 0 0 8px 2px #ffb45480; }
  .halo { position: absolute; top: 4px; bottom: 4px; border-radius: 4px;
          background: #cfccc01a; pointer-events: none; }
  .shade { position: absolute; top: 0; bottom: 0; background: #00000080;
           pointer-events: none; }
  .shade.goldwash { background: #c9a22716; }
  .axislabel { position: absolute; top: 0; font-size: 9px; color: var(--dim);
               transform: translateX(-50%); font-variant-numeric: tabular-nums; }
  /* the live needle: detected input pitch, drawn on the instrument itself */
  #needle { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--amber);
            box-shadow: 0 0 6px 1px #ffb45490; pointer-events: none;
            transition: left 120ms linear; display: none; }
  /* ── ruler footer ───────────────────────────────────────────────────── */
  #rfooter { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  #maskmeta { margin-left: auto; color: var(--dim); font-size: 12px;
              font-variant-numeric: tabular-nums; }
  #hintbar { display: flex; align-items: center; gap: 8px; margin-top: 4px;
             color: var(--dim); font-size: 11px; opacity: .5; }
  .jilabel.hot { color: var(--teal); opacity: 1 !important; font-weight: 700; }
  #lane-ji .jilabel { opacity: .55; }
  /* ── knob strip ─────────────────────────────────────────────────────── */
  #knobstrip { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap;
               margin-top: 16px; justify-content: space-between; }
  .knob { display: flex; flex-direction: column; align-items: center; gap: 2px;
          width: 64px; cursor: ns-resize; user-select: none; }
  .dial { width: 44px; height: 44px; border-radius: 50%; background: var(--panel2);
          border: 1px solid var(--line); position: relative; }
  .dial:hover { border-color: var(--bone); }
  .rot { position: absolute; inset: 0; }
  .ind { position: absolute; left: calc(50% - 1.5px); top: 4px; width: 3px; height: 14px;
         border-radius: 2px; background: var(--bone); }
  .klabel { font-size: 10px; letter-spacing: 1px; color: var(--dim); margin-top: 3px; }
  .kval { font-size: 11px; color: var(--text); font-variant-numeric: tabular-nums; }
  .kval input { width: 56px; font-size: 11px; padding: 1px 4px; }
  /* ── popovers ───────────────────────────────────────────────────────── */
  .popwrap { position: relative; display: inline-block; }
  .pop { position: absolute; z-index: 40; top: calc(100% + 6px); left: 0;
         background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
         padding: 12px; min-width: 240px; box-shadow: 0 8px 30px #000a; display: none;
         max-height: 70vh; overflow-y: auto; }
  .pop.right { left: auto; right: 0; }
  .pop.show { display: block; }
  .pop .prow { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
  .pop .prow:last-child { margin-bottom: 0; }
  .pop label { flex: 0 0 92px; color: var(--dim); font-size: 12px; }
  .pop select { flex: 1; min-width: 120px; }
  .pop hr { border: none; border-top: 1px solid var(--line); margin: 9px 0; }
  .menu-item { display: block; width: 100%; text-align: left; background: none;
               border: none; padding: 6px 8px; border-radius: 6px; color: var(--text);
               font-size: 13px; }
  .menu-item:hover { background: var(--panel2); border: none; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .chips button { padding: 4px 9px; font-variant-numeric: tabular-nums; }
  .chips button.cur { background: var(--bone); color: #17171c; border-color: var(--bone);
                      font-weight: 600; }
  .switch { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
            user-select: none; color: var(--dim); font-size: 13px; }
  .switch input { accent-color: var(--bone); width: 15px; height: 15px; }
  /* context menu */
  #ctx { position: fixed; z-index: 60; background: var(--panel);
         border: 1px solid var(--line); border-radius: 10px; padding: 8px;
         box-shadow: 0 8px 30px #000a; display: none; }
  /* toast */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
           background: var(--panel); border: 1px solid var(--line); color: var(--text);
           border-radius: 10px; padding: 9px 16px; font-size: 13px; z-index: 80;
           box-shadow: 0 8px 30px #000a; opacity: 0; transition: opacity .25s;
           pointer-events: none; max-width: 80vw; }
  #toast.show { opacity: 1; }
  /* perform mode */
  #bigreadout { display: none; text-align: center; margin: 18px 0 10px;
                font-variant-numeric: tabular-nums; }
  #bigreadout .in  { font-size: 44px; font-weight: 600; }
  #bigreadout .tgt { font-size: 44px; font-weight: 700; color: var(--amber); }
  #bigreadout .sub { color: var(--dim); font-size: 15px; margin-top: 2px; }
  #bigreadout.unvoiced .in, #bigreadout.unvoiced .tgt { color: var(--dim); font-weight: 400; }
  body.perform #tuneline, body.perform #rfooter, body.perform #knobstrip,
  body.perform #hintbar, body.perform .hdr-detail { display: none !important; }
  body.perform #bigreadout { display: block; }
  /* offline honesty: dim the stage while the engine stream is down */
  .wrap { transition: opacity .3s; }
  body.offline .wrap { opacity: .5; }
  /* ── harmony strip ──────────────────────────────────────────────────── */
  #harmline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #harm-chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .hchip { padding: 2px 9px; border-radius: 10px; font-size: 12px;
           font-variant-numeric: tabular-nums; border: 1px solid; background: none; }
  /* five pods, one row, guaranteed — below the breakpoint they become
     compact list rows, never wrapping cards */
  #harm-pods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
               gap: 8px; margin-top: 10px; }
  .pod { border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px;
         display: flex; flex-direction: column; gap: 5px; min-width: 0;
         background: var(--panel); }
  @media (max-width: 660px) {
    #harm-pods { grid-template-columns: 1fr; }
    .pod { flex-direction: row; align-items: center; }
    .pod select { width: auto; flex: 1; }
  }
  .pod.sel { box-shadow: 0 0 0 1.5px var(--pc); }
  .pod .phead { display: flex; align-items: center; gap: 6px; cursor: pointer;
                font-size: 11px; letter-spacing: 1px; color: var(--pc);
                font-weight: 700; }
  .pod select { width: 100%; font-size: 12px; padding: 3px 6px; }
  .pod .prow2 { display: flex; align-items: center; gap: 7px; }
  .octdots { display: inline-flex; gap: 4px; }
  .octdots span { width: 11px; height: 11px; border-radius: 50%;
                  border: 1px solid var(--dim); cursor: pointer; }
  .octdots span.fill { background: var(--pc); border-color: var(--pc); }
  .mknob { width: 26px; height: 26px; border-radius: 50%; background: var(--panel2);
           border: 1px solid var(--line); position: relative; cursor: ns-resize;
           flex: none; }
  .mknob .rot { position: absolute; inset: 0; }
  .mknob .ind { position: absolute; left: calc(50% - 1px); top: 2px; width: 2px;
                height: 9px; border-radius: 1px; background: var(--pc); }
  .mklabel { font-size: 9px; color: var(--dim); }
  .msbtn { padding: 1px 7px; font-size: 10px; border-radius: 5px; }
  .msbtn.on { background: var(--pc); color: #17171c; border-color: var(--pc);
              font-weight: 700; }
  .podval { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
  /* voice marks on the ruler: a full-height tick through the degree lane,
     with stacked color chips when voices dedupe onto one degree */
  .gtick { position: absolute; top: 0; bottom: 0; width: 2px;
           transform: translateX(-50%); pointer-events: none;
           display: flex; flex-direction: column; align-items: center;
           padding-top: 2px; gap: 2px; overflow: visible; }
  .gchip { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  /* held MIDI notes: hue-free dashed outline (MIDI-ghost convention) */
  .lug.midi { outline: 1.5px dashed #d6d6e0; outline-offset: 2px; }
  #midi-mode.held { box-shadow: 0 0 8px 2px #d6d6e080; }
  body.perform #harmline > :not(#harm-chips):not(#harm-power) { display: none; }
  body.perform #harm-pods { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- header: 1 line -->
  <div id="header" class="band">
    <h1>AutoEDO <span class="live">Live</span></h1>
    <div class="popwrap">
      <button id="statusbtn" class="ghost" title="engine status — click for audio settings">
        <span class="dot" id="dot"></span><span id="lat" class="tab">…</span>
        <span style="opacity:.8">&#9881;</span>
      </button>
      <div class="pop" id="pop-engine">
        <div class="prow"><label>Input</label><select id="in-dev"></select></div>
        <div class="prow"><label>Output</label><select id="out-dev"></select></div>
        <div class="prow"><label>Buffer</label>
          <select id="bufsize" style="flex:0 0 90px">
            <option>64</option><option>128</option><option selected>256</option>
            <option>512</option><option>1024</option>
          </select>
          <button class="ghost" id="refresh-dev">Refresh</button>
        </div>
        <div class="prow"><label>MIDI input</label>
          <select id="midi-src"><option value="">All inputs</option></select>
        </div>
        <div class="prow"><label>Shifter quality</label>
          <select id="quality">
            <option value="low">Low latency &mdash; 25 ms</option>
            <option value="balanced">Balanced &mdash; 45 ms</option>
            <option value="high">High quality &mdash; 120 ms</option>
          </select>
        </div>
        <div class="prow" id="quality-note" hidden>
          <span class="meta" style="margin:0;flex:1"></span>
        </div>
        <div class="prow"><label>Detection range</label>
          <select id="range">
            <option value="bass">Bass (55–400 Hz)</option>
            <option value="baritone">Baritone (65–450 Hz)</option>
            <option value="tenor">Tenor (80–600 Hz)</option>
            <option value="alto">Alto (100–800 Hz)</option>
            <option value="soprano">Soprano (130–1200 Hz)</option>
            <option value="instrument" selected>Instrument (65–1600 Hz)</option>
            <option value="wide">Wide (40–2000 Hz)</option>
          </select>
        </div>
        <div class="prow"><label>Output gain</label>
          <input type="range" id="gain" min="-60" max="12" step="0.5" value="0" style="flex:1">
          <span class="tab" id="gain-val" style="flex:0 0 56px;text-align:right">0.0 dB</span>
        </div>
        <hr>
        <div class="prow">
          <label class="switch" style="flex:0 0 auto"><input type="checkbox" id="show-piano" checked> 12-EDO keys</label>
          <label class="switch" style="flex:0 0 auto"><input type="checkbox" id="show-ji"> JI lane</label>
        </div>
        <hr>
        <div class="prow">
          <span class="dimtxt" id="engine-detail" style="font-size:12px;flex:1">—</span>
          <button class="ghost" id="restart">Restart engine</button>
        </div>
        <div class="prow" id="err-row" hidden><span class="bad" id="err" style="font-size:12px;white-space:pre-wrap"></span></div>
      </div>
    </div>
    <span class="spacer"></span>
    <button id="bypass" class="hdr-detail" title="pass the dry input through">Bypass</button>
    <span class="seg hdr-detail">
      <button id="ab-a" class="on">A</button><button id="ab-b">B</button>
    </span>
    <button id="ab-copy" class="ghost hdr-detail" title="copy the current settings into both slots">A&rarr;B</button>
    <div class="popwrap hdr-detail">
      <button id="preset-btn">Preset &#9662;</button>
      <div class="pop right" id="pop-preset">
        <div id="preset-list"></div>
        <hr>
        <button class="menu-item" id="preset-save">Save&#8230;</button>
        <button class="menu-item" id="scl-imp">Import .scl&#8230;</button>
        <button class="menu-item" id="scl-exp">Export .scl&#8230;</button>
        <input type="file" id="scl-file" accept=".scl,text/plain" hidden>
      </div>
    </div>
    <button id="perform" title="Perform mode: just the ruler and a stage-readable readout">Perform</button>
  </div>

  <!-- tuning + live: 1 line -->
  <div id="tuneline">
    <div class="popwrap">
      <button id="edo-btn" class="tab">12-EDO &#9662;</button>
      <div class="pop" id="pop-edo">
        <div class="prow"><div class="chips" id="edo-chips"></div></div>
        <div class="prow"><label>Custom</label>
          <input type="text" id="edo" class="num" inputmode="numeric" pattern="[0-9]*"
                 maxlength="2" value="12" style="width:58px">
          <span class="dimtxt" style="font-size:12px">10–72</span>
        </div>
        <hr>
        <div class="prow"><label>Octave stretch</label>
          <input type="range" id="stretch" min="-30" max="30" step="0.5" value="0" style="flex:1">
          <span class="tab" id="stretch-val" style="flex:0 0 74px;text-align:right">+0.0 ¢/oct</span>
        </div>
      </div>
    </div>
    <span class="dotsep">·</span>
    <select id="root" title="root note (degree 0)"></select>
    <input type="number" id="root-cents" class="num" step="0.1" min="-50" max="50" value="0" title="root fine offset, cents">
    <span class="dimtxt">¢</span>
    <span class="dotsep">·</span>
    <span class="dimtxt">A4</span>
    <input type="number" id="a4" class="num" step="0.1" min="400" max="480" value="440.0">
    <span id="readout" class="tab unvoiced"><span class="in">—</span> <span class="dimtxt">&rarr;</span> <span class="tgt">—</span></span>
  </div>

  <!-- big readout (perform mode only) -->
  <div id="bigreadout" class="unvoiced">
    <div><span class="in">—</span> <span class="dimtxt" style="font-size:34px">&rarr;</span> <span class="tgt">—</span></div>
    <div class="sub" id="big-sub">unvoiced</div>
  </div>

  <!-- the ruler -->
  <div class="band">
    <div id="ruler">
      <div class="lane" id="lane-piano"></div>
      <div class="lane" id="lane-ji" hidden></div>
      <div class="lane" id="lane-deg"></div>
      <div class="lane" id="lane-axis"></div>
      <div id="shade-layer" style="position:absolute;inset:0;pointer-events:none"></div>
      <div id="ghost-layer" style="position:absolute;inset:0;pointer-events:none"></div>
      <div id="needle"></div>
    </div>
    <div id="rfooter">
      <button class="ghost" id="deg-all">All</button>
      <button class="ghost" id="deg-none">None</button>
      <button class="ghost" id="deg-inv">Invert</button>
      <div class="popwrap">
        <button class="ghost" id="select-btn">Select &#9662;</button>
        <div class="pop" id="pop-select">
          <div class="prow">
            <button id="near12">Near-12</button>
            <button id="nearji">Near-JI</button>
            <input type="text" id="near-tol" class="num" inputmode="decimal" value="15"
                   style="width:48px" title="filter window, ± cents">
            <span class="dimtxt" style="font-size:12px">±¢</span>
          </div>
          <div class="prow"><label>Rotate mask</label>
            <button id="rot-l">&#9664;</button><button id="rot-r">&#9654;</button>
          </div>
        </div>
      </div>
      <button class="ghost" id="help"
        title="click / drag paints degrees on or off&#10;alt-click auditions the pitch&#10;click a piano key to toggle the nearest degree&#10;right-click the ruler for lane options">?</button>
      <span id="maskmeta"></span>
    </div>
    <div id="hintbar" hidden>
      <span>click / drag paints degrees on or off · alt-click auditions · click a piano key to toggle the nearest degree · right-click for lanes</span>
      <button class="ghost" id="hint-x">&#10005;</button>
    </div>
  </div>

  <!-- knob strip -->
  <div id="knobstrip" class="band"></div>

  <!-- harmony strip (collapsed to one line by default) -->
  <div id="harmstrip" class="band">
    <div id="harmline">
      <button id="harm-power" title="harmony on/off">&#9211;</button>
      <button id="harm-expand" class="ghost" title="show the voice pods">Harmony &#9656;</button>
      <span class="seg" id="harm-lock">
        <button data-lock="off">Off</button><button data-lock="mask">Mask</button><button data-lock="ji">JI</button>
      </span>
      <button id="midi-mode"
        title="MIDI Harmony: held MIDI notes override the mask — retune snaps to the nearest held note, harmony locks to the held pitch classes. Middle C = the root in octave 4; one EDO step per semitone. No notes held = normal behavior. Pick the input in ⚙.">MIDI</button>
      <span id="harm-chips"></span>
      <span style="flex:1"></span>
      <span class="meta" style="margin:0" id="harm-hint"></span>
    </div>
    <div id="harm-pods" hidden></div>
  </div>

</div>

<div id="ctx">
  <label class="switch" style="display:flex;margin-bottom:6px"><input type="checkbox" id="ctx-piano" checked> 12-EDO keys</label>
  <label class="switch" style="display:flex"><input type="checkbox" id="ctx-ji"> JI lane</label>
</div>
<div id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BLACK_PC = new Set([1,3,6,8,10]);
const EDO_CHIPS = [12,17,19,22,24,31,53,72];
const JI_SET = [
  [9,8,'9/8'],[7,6,'7/6'],[6,5,'6/5'],[5,4,'5/4'],[4,3,'4/3'],[11,8,'11/8'],
  [3,2,'3/2'],[8,5,'8/5'],[5,3,'5/3'],[7,4,'7/4'],[9,5,'9/5'],[15,8,'15/8'],
];
const jiCents = JI_SET.map(([a,b,l]) => [1200*Math.log2(a/b), l]);

let cfg = null;
let degrees = [];
let dirtyUntil = 0;
let postTimer = null;
let pending = {};
let activeDeg = -1;
let lugEls = [], shadeEls = [];
let audioCtx = null;
let lastRange = null;

function markDirty() { dirtyUntil = Date.now() + 2500; }

function schedulePost(partial) {
  if (cfg) Object.assign(cfg, partial); // keep the local mirror current
  Object.assign(pending, partial);
  markDirty();
  if (postTimer) return;
  postTimer = setTimeout(async () => {
    const body = JSON.stringify(pending);
    pending = {}; postTimer = null;
    try {
      const r = await fetch('/api/config', { method: 'POST', body });
      applyStatus(await r.json());
    } catch (e) {}
  }, 120);
}

let toastTimer = null;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ---- popover plumbing ------------------------------------------------------
const POPS = [['statusbtn','pop-engine'],['preset-btn','pop-preset'],
              ['edo-btn','pop-edo'],['select-btn','pop-select']];
for (const [b, p] of POPS) {
  $(b).addEventListener('click', ev => {
    ev.stopPropagation();
    const pop = $(p), was = pop.classList.contains('show');
    document.querySelectorAll('.pop.show').forEach(x => x.classList.remove('show'));
    if (!was) pop.classList.add('show');
  });
}
document.addEventListener('click', ev => {
  if (!ev.target.closest('.pop') )
    document.querySelectorAll('.pop.show').forEach(x => x.classList.remove('show'));
  $('ctx').style.display = 'none';
});
function closePops() { document.querySelectorAll('.pop.show').forEach(x => x.classList.remove('show')); }

// ---- tuning math (mirrors the engine) --------------------------------------
function period() { return 1200 + (cfg ? cfg.stretchCents : 0); }
function stepCents() { return period() / (cfg ? cfg.edo : 12); }
function refHz() {
  const c = cfg || { refA4: 440, rootNote: 0, rootCents: 0 };
  return c.refA4 * Math.pow(2, (c.rootNote - 9) / 12) / 16
               * Math.pow(2, c.rootCents / 1200);
}
function noteName(hz) {
  if (!hz || hz <= 0) return '—';
  const a4 = cfg ? cfg.refA4 : 440;
  const midi = 69 + 12 * Math.log2(hz / a4);
  const n = Math.round(midi);
  const cents = Math.round((midi - n) * 100);
  const name = NOTE_NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
  return name + (cents ? ` ${cents > 0 ? '+' : ''}${cents}¢` : '');
}
function hzToDegree(hz) {
  if (!hz || hz <= 0 || !cfg) return null;
  return Math.round(cfg.edo * 1200 * Math.log2(hz / refHz()) / period());
}
function degreeInfo(d) {
  const c = d * stepCents();
  const abs = c + (cfg ? cfg.rootCents : 0);
  const n12 = Math.round(abs / 100);
  const pc12 = ((((cfg ? cfg.rootNote : 0) + n12) % 12) + 12) % 12;
  const d12 = abs - n12 * 100;
  let bestJi = null, bestDist = 1e9;
  for (const [jc, jl] of jiCents) {
    const dist = c - jc;
    if (Math.abs(dist) < Math.abs(bestDist)) { bestDist = dist; bestJi = jl; }
  }
  let s = `deg ${d} · ${c.toFixed(1)}¢ · ${NOTE_NAMES[pc12]} ${d12 >= 0 ? '+' : '−'}${Math.abs(d12).toFixed(1)}¢`;
  if (Math.abs(bestDist) < 40)
    s += ` · ≈${bestJi} ${bestDist >= 0 ? '+' : '−'}${Math.abs(bestDist).toFixed(1)}¢`;
  return s;
}

// ---- pitch ruler -----------------------------------------------------------
function xPct(cents) {
  const edo = cfg ? cfg.edo : 12;
  const pad = 50 / edo;
  return pad + (cents / period()) * (100 - 2 * pad);
}

function buildRuler() {
  if (!cfg) return;
  const edo = cfg.edo, root = cfg.rootNote, rc = cfg.rootCents;
  const stepW = (100 - 100 / edo) / edo;

  const piano = $('lane-piano');
  piano.hidden = !$('show-piano').checked;
  piano.innerHTML = '';
  if (!piano.hidden) {
    for (let s = 0; s <= 12; s++) {
      const cCenter = s * 100 - rc;
      const l = xPct(cCenter - 50), r = xPct(cCenter + 50);
      if (r < 0 || l > 100) continue;
      const pc = ((root + s) % 12 + 12) % 12;
      const k = document.createElement('div');
      k.className = 'pkey ' + (BLACK_PC.has(pc) ? 'black' : 'white');
      k.style.left = Math.max(0, l) + '%';
      k.style.width = (Math.min(100, r) - Math.max(0, l)) + '%';
      k.textContent = NOTE_NAMES[pc];
      k.title = `${NOTE_NAMES[pc]} (12-TET) — click to toggle the nearest degree`;
      k.dataset.s = s;
      piano.appendChild(k);
    }
  }

  const ji = $('lane-ji');
  ji.hidden = !$('show-ji').checked;
  ji.innerHTML = '';
  if (!ji.hidden) {
    for (const [c, label] of jiCents) {
      if (c > period()) continue;
      const t = document.createElement('div');
      t.className = 'jitick';
      t.style.left = xPct(c) + '%';
      ji.appendChild(t);
      const lb = document.createElement('div');
      lb.className = 'jilabel';
      lb.style.left = xPct(c) + '%';
      lb.textContent = label;
      lb.title = `${label} = ${c.toFixed(1)}¢`;
      ji.appendChild(lb);
    }
  }

  const lane = $('lane-deg');
  lane.innerHTML = '';
  lugEls = [];
  const tol = cfg.toleranceCents;
  const labelEvery = edo <= 24 ? 1 : 5;
  for (let d = 0; d < edo; d++) {
    const center = xPct(d * stepCents());
    if (tol > 0) {
      const h = document.createElement('div');
      h.className = 'halo';
      const w = (2 * tol / period()) * (100 - 100 / edo);
      h.style.left = (center - w / 2) + '%';
      h.style.width = w + '%';
      lane.appendChild(h);
    }
    const lug = document.createElement('div');
    lug.className = 'lug';
    lug.style.left = (center - stepW * 0.42) + '%';
    lug.style.width = (stepW * 0.84) + '%';
    lug.textContent = d === 0 ? NOTE_NAMES[root]
                    : (d % labelEvery === 0 ? d : '');
    lug.title = degreeInfo(d);
    lugEls.push(lug);
    lane.appendChild(lug);
  }

  if (!piano.hidden) {
    for (let s = 0; s <= 12; s++) {
      const x = xPct(s * 100 - 50 - rc);
      if (x < 0 || x > 100) continue;
      const g = document.createElement('div');
      g.className = 'gridline';
      g.style.left = x + '%';
      lane.appendChild(g);
    }
  }

  const axis = $('lane-axis');
  axis.innerHTML = '';
  for (let c = 0; c <= period(); c += 300) {
    const a = document.createElement('div');
    a.className = 'axislabel';
    a.style.left = xPct(c) + '%';
    a.textContent = c;
    axis.appendChild(a);
  }

  const shades = $('shade-layer');
  shades.innerHTML = '';
  shadeEls = [];
  for (let d = 0; d < edo; d++) {
    const s = document.createElement('div');
    s.className = 'shade';
    const center = xPct(d * stepCents());
    s.style.left = (center - stepW / 2) + '%';
    s.style.width = stepW + '%';
    shadeEls.push(s);
    shades.appendChild(s);
  }

  $('ghost-layer').dataset.key = ''; // lugs are fresh: force voice-mark redraw
  midiKey = null;                    // ...and the held-note lighting
  updateRulerState();
}

function updateRulerState() {
  if (!cfg) return;
  const edo = cfg.edo;
  for (let d = 0; d < Math.min(edo, lugEls.length); d++) {
    const lit = !!degrees[d];
    const lug = lugEls[d];
    lug.classList.toggle('off', !lit);
    lug.classList.toggle('root', d === 0);
    lug.classList.toggle('active', d === activeDeg);
    if (shadeEls[d]) {
      shadeEls[d].className = 'shade' + (d === 0 && lit ? ' goldwash' : '');
      shadeEls[d].style.opacity = lit ? (d === 0 ? 1 : 0) : 1;
    }
  }
  updateMaskMeta();
}

function updateMaskMeta() {
  const edo = cfg ? cfg.edo : 12;
  const lit = [];
  for (let d = 0; d < edo; d++) if (degrees[d]) lit.push(d);
  let gapTxt = '';
  if (lit.length > 0 && lit.length < edo) {
    let maxGap = 0;
    for (let i = 0; i < lit.length; i++) {
      const next = i + 1 < lit.length ? lit[i + 1] : lit[0] + edo;
      maxGap = Math.max(maxGap, next - lit[i]);
    }
    const gapC = maxGap * stepCents();
    gapTxt = ` · gap <span class="${gapC > 240 ? 'bad' : ''}">${gapC.toFixed(0)}¢${gapC > 240 ? ' ⚠' : ''}</span>`;
  }
  const scaleTag = cfg && cfg.scaleName
    ? `<span style="color:var(--bone)">${cfg.scaleName}</span> · ` : '';
  $('maskmeta').innerHTML = scaleTag +
    `${lit.length}/${edo} · step ${stepCents().toFixed(1)}¢${gapTxt}` +
    (lit.length === 0 ? ' · <span class="bad">empty = chromatic fallback</span>' : '');
}

// pointer interaction: click toggles, drag paints, alt auditions
let painting = false, paintVal = 1, paintTouched = null;
function degFromEvent(ev) {
  const lane = $('lane-deg');
  const rect = lane.getBoundingClientRect();
  const frac = (ev.clientX - rect.left) / rect.width;
  const edo = cfg.edo, pad = 50 / edo / 100;
  const cents = (frac - pad) / (1 - 2 * pad) * period();
  let d = Math.round(cents / stepCents());
  return Math.max(0, Math.min(edo - 1, d));
}
$('lane-deg').addEventListener('pointerdown', ev => {
  if (!cfg || ev.button === 2) return;
  const d = degFromEvent(ev);
  if (ev.altKey) { audition(d); return; }
  if (ev.shiftKey && selPod >= 0) { // learn-from-ruler: lug -> pod interval
    const hm = harmCfg().hm.slice();
    hm[selPod] = d === 0 ? cfg.edo : d;
    schedulePost({ hm });
    syncHarm();
    showToast(`Voice ${selPod + 1} interval set to ↑${hm[selPod]} from the ruler`);
    return;
  }
  painting = true;
  markDirty();
  paintTouched = new Set([d]);
  paintVal = degrees[d] ? 0 : 1;
  degrees[d] = paintVal;
  $('lane-deg').setPointerCapture(ev.pointerId);
  updateRulerState();
});
$('lane-deg').addEventListener('pointermove', ev => {
  // contrast on demand: brighten the JI fraction nearest the hovered degree
  if (cfg && !$('lane-ji').hidden) {
    const cents = degFromEvent(ev) * stepCents();
    let best = null, bestD = 1e9;
    document.querySelectorAll('#lane-ji .jilabel').forEach(el => {
      el.classList.remove('hot');
      const d = Math.abs(parseFloat(el.style.left) - xPct(cents));
      if (d < bestD) { bestD = d; best = el; }
    });
    if (best) best.classList.add('hot');
  }
  if (!painting) return;
  const d = degFromEvent(ev);
  if (!paintTouched.has(d)) {
    markDirty();
    paintTouched.add(d);
    degrees[d] = paintVal;
    updateRulerState();
  }
});
$('lane-deg').addEventListener('pointerleave', () => {
  document.querySelectorAll('#lane-ji .jilabel.hot').forEach(el => el.classList.remove('hot'));
});
window.addEventListener('pointerup', () => {
  if (!painting) return;
  painting = false;
  postDegrees();
});
$('lane-piano').addEventListener('click', ev => {
  if (!cfg) return;
  const key = ev.target.closest('.pkey');
  if (!key) return;
  const s = +key.dataset.s;
  const cents = s * 100 - cfg.rootCents;
  let d = Math.round(cents / stepCents());
  d = ((d % cfg.edo) + cfg.edo) % cfg.edo;
  markDirty();
  degrees[d] = degrees[d] ? 0 : 1;
  updateRulerState();
  postDegrees();
});
// right-click: lane visibility
$('ruler').addEventListener('contextmenu', ev => {
  ev.preventDefault();
  const m = $('ctx');
  $('ctx-piano').checked = $('show-piano').checked;
  $('ctx-ji').checked = $('show-ji').checked;
  m.style.display = 'block';
  m.style.left = Math.min(ev.clientX, window.innerWidth - 170) + 'px';
  m.style.top = ev.clientY + 'px';
});
$('ctx').addEventListener('click', ev => ev.stopPropagation());
$('ctx-piano').onchange = e => { $('show-piano').checked = e.target.checked; buildRuler(); };
$('ctx-ji').onchange = e => { $('show-ji').checked = e.target.checked; buildRuler(); };

function postDegrees() {
  // a hand-edited mask is no longer the named catalog scale
  const clear = cfg && cfg.scaleName ? { scaleCat: '', scaleName: '' } : {};
  schedulePost({ degrees: degrees.slice(0, 72), ...clear });
}

function audition(d) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const f = refHz() * 16 * Math.pow(2, d * stepCents() / 1200);
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.22, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.45);
  } catch (e) {}
}

// ---- selection tools -------------------------------------------------------
function setDegreesBulk(fn) {
  const edo = cfg ? cfg.edo : 12;
  const old = degrees.slice();
  for (let d = 0; d < edo; d++) degrees[d] = fn(d, old);
  updateRulerState();
  postDegrees();
}
function dist12(d) {
  const abs = d * stepCents() + cfg.rootCents;
  return Math.abs(abs - Math.round(abs / 100) * 100);
}
function distJi(d) {
  const c = d * stepCents();
  let best = 1e9;
  for (const [jc] of jiCents) best = Math.min(best, Math.abs(c - jc));
  return Math.min(best, c);
}
$('deg-all').onclick  = () => setDegreesBulk(() => 1);
$('deg-none').onclick = () => setDegreesBulk(() => 0);
$('deg-inv').onclick  = () => setDegreesBulk((d, o) => o[d] ? 0 : 1);
$('rot-l').onclick    = () => setDegreesBulk((d, o) => o[(d + 1) % cfg.edo]);
$('rot-r').onclick    = () => setDegreesBulk((d, o) => o[(d - 1 + cfg.edo) % cfg.edo]);
$('near12').onclick   = () => {
  const n = parseFloat($('near-tol').value) || 15;
  setDegreesBulk(d => dist12(d) <= n ? 1 : 0);
};
$('nearji').onclick   = () => {
  const n = parseFloat($('near-tol').value) || 15;
  setDegreesBulk(d => distJi(d) <= n ? 1 : 0);
};

// presets (computed — correct in any EDO by construction)
function nearestDegreeToCents(c) { return ((Math.round(c / stepCents()) % cfg.edo) + cfg.edo) % cfg.edo; }
function maskFromCents(list) {
  const s = new Set(list.map(nearestDegreeToCents));
  setDegreesBulk(d => s.has(d) ? 1 : 0);
}
function fifthDegree() { return Math.round(701.955 / stepCents()); }
function chainOfFifths(count) {
  const f = fifthDegree(), out = [];
  for (let k = -1; k <= count - 2; k++)
    out.push((((k * f) % cfg.edo) + cfg.edo) % cfg.edo);
  return out;
}
const PRESETS = {
  'Chromatic (all)':        () => setDegreesBulk(() => 1),
  'Major (nearest 12-TET)': () => maskFromCents([0,200,400,500,700,900,1100]),
  'Minor (nearest 12-TET)': () => maskFromCents([0,200,300,500,700,800,1000]),
  'Pentatonic (nearest 12-TET)': () => maskFromCents([0,200,400,700,900]),
  'Diatonic [7] (chain of fifths)': () => { const s = new Set(chainOfFifths(7)); setDegreesBulk(d => s.has(d) ? 1 : 0); },
  'Pentatonic [5] (chain of fifths)': () => { const s = new Set(chainOfFifths(5)); setDegreesBulk(d => s.has(d) ? 1 : 0); },
};
function userPresets() {
  try { return JSON.parse(localStorage.getItem('autoedoPresets') || '{}'); }
  catch (e) { return {}; }
}
function rebuildPresetList() {
  const host = $('preset-list');
  host.innerHTML = '';
  const add = (label, fn) => {
    const b = document.createElement('button');
    b.className = 'menu-item';
    b.textContent = label;
    b.onclick = () => { fn(); closePops(); };
    host.appendChild(b);
  };
  for (const name of Object.keys(PRESETS)) add(name, PRESETS[name]);
  const up = userPresets();
  for (const name of Object.keys(up))
    add(`${name} (saved, ${up[name].edo}-EDO)`, () => {
      const p = userPresets()[name];
      const cents = [];
      for (let d = 0; d < p.edo; d++) if (p.degrees[d]) cents.push(d * 1200 / p.edo);
      maskFromCents(cents);
    });
  if (typeof catalogSections === 'function' && SCALES) {
    const hr = document.createElement('hr');
    host.appendChild(hr);
    catalogSections(host);
  }
}
$('preset-save').onclick = () => {
  closePops();
  const name = prompt('Preset name:');
  if (!name) return;
  const up = userPresets();
  up[name] = { edo: cfg.edo, degrees: degrees.slice(0, cfg.edo) };
  localStorage.setItem('autoedoPresets', JSON.stringify(up));
  rebuildPresetList();
};

// Scala .scl
$('scl-exp').onclick = () => {
  closePops();
  const lit = [];
  for (let d = 1; d < cfg.edo; d++) if (degrees[d]) lit.push(d);
  let s = '! autoedo.scl\n!\n';
  s += `AutoEDO mask export: subset of ${cfg.edo}-EDO` +
       (cfg.stretchCents ? ` (octave ${period().toFixed(1)}c)` : '') + '\n';
  s += ` ${lit.length + 1}\n!\n`;
  for (const d of lit) s += ` ${(d * stepCents()).toFixed(5)}\n`;
  s += cfg.stretchCents ? ` ${period().toFixed(5)}\n` : ' 2/1\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([s], { type: 'text/plain' }));
  a.download = `autoedo-${cfg.edo}edo.scl`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$('scl-imp').onclick = () => { closePops(); $('scl-file').click(); };
$('scl-file').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(l => !l.trim().startsWith('!'));
  const cents = [0];
  for (let i = 2; i < lines.length; i++) {
    const tok = lines[i].trim().split(/\s+/)[0];
    if (!tok) continue;
    let c = null;
    if (tok.includes('.')) c = parseFloat(tok);
    else if (tok.includes('/')) {
      const [a, b] = tok.split('/').map(Number);
      if (a > 0 && b > 0) c = 1200 * Math.log2(a / b);
    } else if (/^\d+$/.test(tok)) c = 1200 * Math.log2(parseInt(tok, 10));
    if (c !== null && isFinite(c)) cents.push(((c % period()) + period()) % period());
  }
  if (cents.length > 1) maskFromCents(cents);
};

// ---- knob strip ------------------------------------------------------------
// Six mini-knobs: drag vertically, double-click to type. cfgKey/scale map to
// the JSON config; fmt renders the value readout.
const KNOBS = [
  { id: 'speed', label: 'SPEED',  key: 'retuneMs',       min: 0, max: 400, step: 1,   scale: 1,    fmt: v => `${Math.round(v)} ms` },
  { id: 'amt',   label: 'AMOUNT', key: 'amount',         min: 0, max: 100, step: 1,   scale: 0.01, fmt: v => `${Math.round(v)} %` },
  { id: 'tol',   label: 'TOL',    key: 'toleranceCents', min: 0, max: 50,  step: 0.5, scale: 1,    fmt: v => `±${v.toFixed(1)} ¢` },
  { id: 'stick', label: 'STICK',  key: 'stickiness',     min: 0, max: 100, step: 1,   scale: 0.01, fmt: v => `${Math.round(v)} %` },
  { id: 'trans', label: 'TRANS',  key: 'transitionMs',   min: 0, max: 200, step: 1,   scale: 1,    fmt: v => `${Math.round(v)} ms` },
  { id: 'human', label: 'HUMAN',  key: 'humanize',       min: 0, max: 100, step: 1,   scale: 0.01, fmt: v => `${Math.round(v)} %` },
];
const knobState = {};
function knobSet(k, v, post) {
  v = Math.max(k.min, Math.min(k.max, v));
  v = Math.round(v / k.step) * k.step;
  knobState[k.id] = v;
  const norm = (v - k.min) / (k.max - k.min);
  $(`rot-${k.id}`).style.transform = `rotate(${-135 + 270 * norm}deg)`;
  $(`kval-${k.id}`).textContent = k.fmt(v);
  if (post) {
    schedulePost({ [k.key]: v * k.scale });
    if (k.key === 'toleranceCents' && cfg) { cfg.toleranceCents = v; buildRuler(); }
  }
}
function buildKnobs() {
  const host = $('knobstrip');
  for (const k of KNOBS) {
    const el = document.createElement('div');
    el.className = 'knob';
    el.id = `knob-${k.id}`;
    el.title = 'drag up/down · double-click to type';
    el.innerHTML =
      `<div class="dial"><div class="rot" id="rot-${k.id}"><div class="ind"></div></div></div>` +
      `<div class="klabel">${k.label}</div><div class="kval" id="kval-${k.id}">—</div>`;
    host.appendChild(el);
    knobState[k.id] = k.min;

    let dragY = null, dragV = null;
    el.addEventListener('pointerdown', ev => {
      if (ev.target.tagName === 'INPUT') return;
      dragY = ev.clientY; dragV = knobState[k.id];
      el.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    el.addEventListener('pointermove', ev => {
      if (dragY === null) return;
      const dv = (dragY - ev.clientY) / 150 * (k.max - k.min);
      knobSet(k, dragV + dv, true);
    });
    el.addEventListener('pointerup', () => { dragY = null; });
    el.addEventListener('dblclick', () => {
      const kv = $(`kval-${k.id}`);
      const cur = knobState[k.id];
      kv.innerHTML = `<input type="text" class="num" value="${cur}">`;
      const inp = kv.querySelector('input');
      inp.focus(); inp.select();
      const commit = () => {
        const v = parseFloat(inp.value);
        knobSet(k, isNaN(v) ? cur : v, !isNaN(v));
        if (isNaN(v)) $(`kval-${k.id}`).textContent = k.fmt(cur);
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
      inp.addEventListener('blur', commit);
    });
  }
}
buildKnobs();

// ---- harmony strip ---------------------------------------------------------
const VOICE_COLORS = ['var(--v1)', 'var(--v2)', 'var(--v3)', 'var(--v4)', 'var(--v5)'];
let selPod = -1;      // pod selected for learn-from-ruler
let podEls = [];

function harmCfg() { // defaults until the first status lands
  return cfg || { edo: 12, harmOn: false, harmLock: 'mask', hm: [0,0,0,0,0], hx: [0,0,0,0,0],
                  hg: [0,0,0,0,0], hp: [0,0,0,0,0], hMute: [0,0,0,0,0], hSolo: [0,0,0,0,0] };
}
// Interval name for a step's cents value: nearest 12-TET interval name when
// within ±25¢ (P5 for 705.9¢ in 17-EDO), otherwise nothing (bare step).
const IV_NAMES = [[0,'P1'],[100,'m2'],[200,'M2'],[300,'m3'],[400,'M3'],[500,'P4'],
                  [600,'TT'],[700,'P5'],[800,'m6'],[900,'M6'],[1000,'m7'],[1100,'M7'],[1200,'P8']];
function intervalName(cents) {
  for (const [c, n] of IV_NAMES)
    if (Math.abs(cents - c) <= 25) return n;
  return '';
}
const EXT_LABEL = ['', ' +8ve', ' +15ma'];
function voiceLabel(v, c) {
  const iv = c.hm[v];
  if (!iv) return 'None';
  // thin space between arrow and number; extension as +8ve / +15ma
  return `${iv > 0 ? '↑' : '↓'} ${Math.abs(iv)}${EXT_LABEL[c.hx[v]] || ''}`;
}

function miniKnob(host, color, opts) { // {min,max,get,fmt,onset}
  const el = document.createElement('div');
  el.className = 'mknob';
  el.style.setProperty('--pc', color);
  el.innerHTML = '<div class="rot"><div class="ind"></div></div>';
  host.appendChild(el);
  const draw = () => {
    const n = (opts.get() - opts.min) / (opts.max - opts.min);
    el.querySelector('.rot').style.transform = `rotate(${-135 + 270 * n}deg)`;
  };
  let y0 = null, v0 = null;
  el.addEventListener('pointerdown', ev => {
    y0 = ev.clientY; v0 = opts.get();
    el.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });
  el.addEventListener('pointermove', ev => {
    if (y0 === null) return;
    let v = v0 + (y0 - ev.clientY) / 120 * (opts.max - opts.min);
    v = Math.max(opts.min, Math.min(opts.max, v));
    opts.onset(v);
    draw();
  });
  el.addEventListener('pointerup', () => { y0 = null; });
  el.redraw = draw;
  return el;
}

function rebuildIntervalOptions(sel) {
  const edo = cfg ? cfg.edo : 12;
  const cur = sel.value;
  sel.innerHTML = '';
  const add = (val, label) => {
    const o = document.createElement('option');
    o.value = val; o.textContent = label;
    sel.appendChild(o);
  };
  add(0, 'None');
  // label only in the pool (P5-style names when they exist); cents live on
  // the pod's readout line
  const lbl = (n, arrow) => {
    const name = n === edo ? '8ve' : intervalName(n * stepCents());
    return `${arrow} ${n}${name ? ` ${name}` : ''}`;
  };
  for (let n = 1; n <= edo; n++) add(n, lbl(n, '↑'));
  for (let n = 1; n <= edo; n++) add(-n, lbl(n, '↓'));
  sel.value = cur !== '' && Math.abs(+cur) <= edo ? cur : 0;
}

function buildHarmPods() {
  const host = $('harm-pods');
  host.innerHTML = '';
  podEls = [];
  for (let v = 0; v < 5; v++) {
    const c = harmCfg();
    const pod = document.createElement('div');
    pod.className = 'pod';
    pod.style.setProperty('--pc', VOICE_COLORS[v]);
    const head = document.createElement('div');
    head.className = 'phead';
    head.innerHTML = `V${v + 1} <span class="podval" style="font-weight:400"></span>`;
    head.title = 'select this pod, then shift-click a ruler lug to set its interval';
    head.onclick = () => {
      selPod = selPod === v ? -1 : v;
      podEls.forEach((p, i) => p.pod.classList.toggle('sel', i === selPod));
    };
    pod.appendChild(head);

    const sel = document.createElement('select');
    rebuildIntervalOptions(sel);
    sel.value = c.hm[v];
    sel.onchange = () => { const hm = harmCfg().hm.slice(); hm[v] = +sel.value; schedulePost({ hm }); syncHarm(); };
    pod.appendChild(sel);

    const row = document.createElement('div');
    row.className = 'prow2';
    const dots = document.createElement('span');
    dots.className = 'octdots';
    dots.title = 'octave extension (stacks in the voice’s direction)';
    for (let k = 0; k < 3; k++) {
      const d = document.createElement('span');
      d.onclick = () => { const hx = harmCfg().hx.slice(); hx[v] = k; schedulePost({ hx }); syncHarm(); };
      dots.appendChild(d);
    }
    row.appendChild(dots);
    const gain = miniKnob(row, VOICE_COLORS[v], {
      min: -24, max: 6,
      get: () => Math.max(-24, harmCfg().hg[v]),
      onset: x => { const hg = harmCfg().hg.slice(); hg[v] = Math.round(x * 2) / 2; schedulePost({ hg }); updVal(); },
    });
    gain.title = 'voice gain (drag)';
    const pan = miniKnob(row, VOICE_COLORS[v], {
      min: -1, max: 1,
      get: () => harmCfg().hp[v],
      onset: x => { const hp = harmCfg().hp.slice(); hp[v] = Math.round(x * 20) / 20; schedulePost({ hp }); updVal(); },
    });
    pan.title = 'pan (drag)';
    const mkbtn = (txt, key) => {
      const b = document.createElement('button');
      b.className = 'msbtn';
      b.textContent = txt;
      b.onclick = () => {
        const a = harmCfg()[key].slice();
        a[v] = a[v] ? 0 : 1;
        schedulePost({ [key]: a });
        syncHarm();
      };
      row.appendChild(b);
      return b;
    };
    const mb = mkbtn('M', 'hMute');
    const sb = mkbtn('S', 'hSolo');
    pod.appendChild(row);

    const val = document.createElement('div');
    val.className = 'podval';
    pod.appendChild(val);

    const updVal = () => {
      const cc = harmCfg();
      const iv = cc.hm[v];
      const eff = iv ? iv + Math.sign(iv) * cc.hx[v] * cc.edo : 0;
      const cents = iv ? ` · ${eff > 0 ? '+' : '−'}${Math.abs(eff * stepCents()).toFixed(1)}¢` : '';
      val.textContent = `${cc.hg[v].toFixed(1)} dB · pan ${cc.hp[v] === 0 ? 'C'
        : (cc.hp[v] < 0 ? 'L' : 'R') + Math.abs(Math.round(cc.hp[v] * 100))}${cents}`;
    };
    updVal();
    host.appendChild(pod);
    podEls.push({ pod, sel, dots, gain, pan, mb, sb, head, updVal });
  }
}
buildHarmPods();

function syncHarm() {
  const c = harmCfg();
  $('harm-power').classList.toggle('on', !!c.harmOn);
  document.querySelectorAll('#harm-lock button').forEach(b =>
    b.classList.toggle('on', b.dataset.lock === c.harmLock));
  // collapsed chips: what the voices are, not just how many — and ONLY when
  // collapsed (expanded shows the pods; never the same state twice)
  const chips = $('harm-chips');
  chips.hidden = ! $('harm-pods').hidden;
  const key = JSON.stringify([c.harmOn, c.hm, c.hx, c.hMute]);
  if (chips.dataset.key !== key) {
    chips.dataset.key = key;
    chips.innerHTML = '';
    for (let v = 0; v < 5; v++) {
      if (!c.hm[v]) continue;
      const ch = document.createElement('span');
      ch.className = 'hchip';
      ch.style.color = VOICE_COLORS[v];
      ch.style.borderColor = VOICE_COLORS[v];
      ch.style.opacity = (c.harmOn && !c.hMute[v]) ? 1 : 0.35;
      ch.textContent = voiceLabel(v, c);
      chips.appendChild(ch);
    }
  }
  podEls.forEach((p, v) => {
    if (document.activeElement !== p.sel) p.sel.value = c.hm[v];
    [...p.dots.children].forEach((d, k) => d.classList.toggle('fill', k <= c.hx[v] && c.hx[v] > 0 || (k === 0 && c.hx[v] === 0)));
    p.mb.classList.toggle('on', !!c.hMute[v]);
    p.sb.classList.toggle('on', !!c.hSolo[v]);
    p.gain.redraw(); p.pan.redraw(); p.updVal();
  });
}

$('harm-power').onclick = () => { schedulePost({ harmOn: !harmCfg().harmOn }); syncHarm(); };
document.querySelectorAll('#harm-lock button').forEach(b => {
  b.onclick = () => { schedulePost({ harmLock: b.dataset.lock }); syncHarm(); };
});
$('harm-expand').onclick = () => {

};

// Voice marks on the ruler: one full-height tick through the degree lane per
// sounding pitch class, stacked color chips when voices dedupe onto it, and a
// colored border-glow on the target lug (gold override on root landings).
let glowedLugs = [];
function updateGhosts(degs) {
  const layer = $('ghost-layer');
  const edo = cfg ? cfg.edo : 12;
  const c = harmCfg();
  const key = JSON.stringify([degs, edo, c.hMute, c.hSolo]);
  if (layer.dataset.key === key) return;
  layer.dataset.key = key;
  layer.innerHTML = '';
  for (const lug of glowedLugs) lug.style.boxShadow = '';
  glowedLugs = [];
  if (!degs) return;

  const lane = $('lane-deg');
  const anySolo = c.hSolo.some(x => x);

  // group voices by landing pitch class
  const byPc = {};
  for (let v = 0; v < 5; v++) {
    if (degs[v] === null || degs[v] === undefined) continue;
    const pc = ((degs[v] % edo) + edo) % edo;
    (byPc[pc] = byPc[pc] || []).push(v);
  }

  for (const [pcs, voices] of Object.entries(byPc)) {
    const pc = +pcs;
    const goldWin = pc === 0; // gold override beats the voice color on root
    const tickCol = goldWin ? 'var(--gold)' : VOICE_COLORS[voices[0]];
    // every voice on this pc silent (muted / not soloed) -> dim the mark
    const silent = voices.every(v => c.hMute[v] || (anySolo && !c.hSolo[v]));

    const g = document.createElement('div');
    g.className = 'gtick';
    g.style.left = xPct(pc * stepCents()) + '%';
    g.style.top = lane.offsetTop + 'px';
    g.style.bottom = 'auto';
    g.style.height = lane.offsetHeight + 'px';
    g.style.background = tickCol;
    g.style.opacity = silent ? 0.25 : 1;
    if (voices.length > 1) // dedupe: one tick, stacked color chips
      for (const v of voices) {
        const chip = document.createElement('div');
        chip.className = 'gchip';
        chip.style.background = VOICE_COLORS[v];
        g.appendChild(chip);
      }
    layer.appendChild(g);

    // lug border-glow in the voice color (amber active target wins)
    if (pc !== activeDeg && lugEls[pc]) {
      lugEls[pc].style.boxShadow =
        `0 0 7px 2px ${goldWin ? '#c9a227aa' : VOICE_COLORS[voices[0]]}`;
      if (silent) lugEls[pc].style.boxShadow = '';
      else glowedLugs.push(lugEls[pc]);
    }
  }
}

// Light up the lugs whose pitch classes are receiving MIDI input.
// Note 60 (middle C) pivots to degree 4*edo; one EDO step per semitone.
let midiKey = null;
function updateMidiLugs(notes) {
  const edo = cfg ? cfg.edo : 12;
  const on = cfg && cfg.midiMode && notes && notes.length > 0;
  const key = JSON.stringify([on ? notes : [], edo]);
  if (key === midiKey) return;
  midiKey = key;
  const pcs = new Set();
  if (on)
    for (const n of notes) {
      const j = 4 * edo + (n - 60);
      pcs.add(((j % edo) + edo) % edo);
    }
  for (let d = 0; d < lugEls.length; d++)
    lugEls[d].classList.toggle('midi', pcs.has(d));
  $('midi-mode').classList.toggle('held', !!on);
}

// ---- scale catalog (xentar-scales-dump) ------------------------------------
let SCALES = null;
async function loadScales() {
  try {
    SCALES = await (await fetch('/api/scales')).json();
    rebuildPresetList();
  } catch (e) {}
}
function quantized12Scales(edo, nativeSets) {
  // steps = sort(dedupe(round(cents*EDO/1200) % EDO)); Chromatic = all;
  // drop if identical to a native scale of this EDO
  const out = {};
  for (const [name, cents] of Object.entries(SCALES.reference12Cents)) {
    let steps;
    if (cents === null) steps = Array.from({ length: edo }, (_, i) => i);
    else steps = [...new Set(cents.map(c => Math.round(c * edo / 1200) % edo))].sort((a, b) => a - b);
    const k = steps.join(',');
    if (nativeSets.has(k)) continue;
    out[name] = { steps };
  }
  return out;
}
function applyCatalogScale(cat, name, entry) {
  const edo = cfg.edo;
  const set = new Set(entry.steps);
  markDirty();
  for (let d = 0; d < edo; d++) degrees[d] = set.has(d) ? 1 : 0;
  updateRulerState();
  schedulePost({ degrees: degrees.slice(0, 72), scaleCat: cat, scaleName: name });
}
function catalogSections(host) {
  if (!SCALES || !cfg) return;
  const edo = cfg.edo;
  const packs = Object.entries(SCALES.edos)
    .filter(([k, p]) => k !== 'bohlenpierce' && p.edo === edo);
  const nativeSets = new Set();
  for (const [, p] of packs)
    for (const scales of Object.values(p.categories))
      for (const s of Object.values(scales))
        if (s.steps) nativeSets.add(s.steps.slice().sort((a, b) => a - b).join(','));

  const addCat = (catName, scales) => {
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = catName;
    sum.style.cssText = 'cursor:pointer;color:var(--dim);font-size:12px;padding:4px 6px';
    det.appendChild(sum);
    for (const [name, entry] of Object.entries(scales)) {
      const b = document.createElement('button');
      b.className = 'menu-item';
      const multi = !!entry.octaves;
      b.innerHTML = name + (multi ? ' <span style="color:var(--teal)">&#8859;</span>' : '');
      if (multi)
        b.title = 'multi-octave scale — flattened to octave 0 here (the mask and harmony both use octave 0)';
      else if (entry.description)
        b.title = entry.description;
      b.onclick = () => { applyCatalogScale(catName, name, entry); closePops(); };
      det.appendChild(b);
    }
    host.appendChild(det);
  };
  for (const [, p] of packs)
    for (const [catName, scales] of Object.entries(p.categories))
      addCat(catName, scales);
  const q12 = quantized12Scales(edo, nativeSets);
  if (Object.keys(q12).length > 0)
    addCat('12-EDO Reference (quantized)', q12);
}

function rebuildChips() {
  const host = $('edo-chips');
  host.innerHTML = '';
  for (const n of EDO_CHIPS) {
    const b = document.createElement('button');
    b.className = (cfg && cfg.edo === n ? 'cur' : '');
    b.textContent = n;
    b.onclick = () => { $('edo').value = n; commitEdo(n); closePops(); };
    host.appendChild(b);
  }
  $('edo-btn').innerHTML = `${cfg ? cfg.edo : 12}-EDO &#9662;`;
}
$('edo').oninput = e => {
  e.target.value = e.target.value.replace(/[^0-9]/g, '');
  markDirty();
  const v = parseInt(e.target.value, 10);
  if (v >= 10 && v <= 72) commitEdo(v);
};
$('edo').onchange = e => {
  let v = parseInt(e.target.value, 10);
  if (isNaN(v)) v = cfg ? cfg.edo : 12;
  v = Math.max(10, Math.min(72, v));
  e.target.value = v;
  commitEdo(v);
};
$('edo').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
function commitEdo(v) {
  const post = { edo: v };
  const sugg = v > 41 ? Math.min(0.7, (v - 24) / 48) : 0;
  if (cfg && sugg > 0 && cfg.stickiness < sugg) {
    post.stickiness = sugg;
    knobSet(KNOBS[3], Math.round(sugg * 100), false);
    showToast(`Stickiness auto-raised to ${Math.round(sugg * 100)}% — ` +
              `${v}-EDO step (${(1200 / v).toFixed(1)}¢) is narrower than vibrato`);
  }
  if (cfg && cfg.edo !== v) {
    cfg.edo = v;
    buildRuler();
    rebuildPresetList();                                 // catalog is per-EDO
    podEls.forEach(p => rebuildIntervalOptions(p.sel));  // so is the interval pool
    // voice intervals keep their step counts, but never silently exceed the
    // new equave — clamp with a toast
    const hm = harmCfg().hm.slice();
    const clamped = [];
    for (let i = 0; i < 5; i++)
      if (Math.abs(hm[i]) > v) {
        hm[i] = Math.sign(hm[i]) * v;
        clamped.push(i + 1);
      }
    if (clamped.length) {
      post.hm = hm;
      cfg.hm = hm; // mirror now so the pod sync below shows the clamped value
      showToast(`Voice ${clamped.join(', ')} interval clamped to the ${v}-EDO equave`);
    }
    syncHarm();
  }
  rebuildChips();
  schedulePost(post);
}

  if (sel.value !== (currentUid || '')) sel.value = '';
}
async function loadDevices() {
  try {
    const r = await fetch('/api/devices');
    const j = await r.json();
    fillDeviceSelect($('in-dev'), j.devices || [], true, cfg ? cfg.inputUid : '');
    fillDeviceSelect($('out-dev'), j.devices || [], false, cfg ? cfg.outputUid : '');
    const ms = $('midi-src');
    ms.innerHTML = '<option value="">All inputs</option>';
    for (const name of j.midiSources || []) {
      const o = document.createElement('option');
      o.value = name; o.textContent = name;
      ms.appendChild(o);
    }
    ms.value = cfg ? cfg.midiSource : '';
    if (ms.value !== (cfg ? cfg.midiSource : '')) ms.value = '';
  } catch (e) {}
}

// ---- status / poll ---------------------------------------------------------
function updateReadout(s) {
  const det = s.voiced ? s.detectedHz : 0;
  const tgt = s.voiced ? s.targetHz : 0;
  let inTxt = '—', tgtTxt = '—', sub = 'unvoiced';
  if (det && tgt && cfg) {
    const j = hzToDegree(tgt);
    const deg = ((j % cfg.edo) + cfg.edo) % cfg.edo;
    const oct = Math.floor(j / cfg.edo);
    inTxt = noteName(det);
    tgtTxt = `${deg}\\${cfg.edo}`;
    sub = `${det.toFixed(1)} Hz → ${tgt.toFixed(1)} Hz · oct ${oct} · ` +
          `${(1200 * Math.log2(det / tgt)).toFixed(1)}¢ off`;
    if (deg !== activeDeg) { activeDeg = deg; updateRulerState(); }
  } else if (activeDeg !== -1) {
    activeDeg = -1; updateRulerState();
  }
  for (const [id, cls] of [['readout', 'unvoiced'], ['bigreadout', 'unvoiced']]) {
    const el = $(id);
    el.classList.toggle(cls, !s.voiced);
    el.querySelector('.in').textContent = inTxt;
    el.querySelector('.tgt').textContent = tgtTxt + (id === 'readout' && tgt ? ` · ${tgt.toFixed(1)} Hz` : '');
  }
  $('big-sub').textContent = sub;

  updateGhosts(s.harmDeg);
  updateMidiLugs(s.midiNotes);

  // live needle at the detected pitch's cents position (folded into the octave)
  const needle = $('needle');
  if (det > 0) {
    let c = 1200 * Math.log2(det / refHz());
    c = ((c % period()) + period()) % period();
    needle.style.left = xPct(c) + '%';
    needle.style.display = 'block';
  } else {
    needle.style.display = 'none';
  }
}

function applyStatus(s) {
  if (!s) return;

  $('dot').classList.toggle('ok', !!s.running);
  $('lat').textContent = s.running ? `${s.latencyMs.toFixed(0)} ms` : 'stopped';
  $('lat').classList.toggle('bad', !s.running);
  $('statusbtn').title = s.running
    ? `${s.inputName} → ${s.outputName} · ${Math.round(s.inputRate)} → ${Math.round(s.outputRate)} Hz · latency ≈ ${s.latencyMs.toFixed(0)} ms — click for audio settings`
    : 'engine stopped — click for audio settings';
  $('engine-detail').textContent = (s.running
    ? `${s.inputName} → ${s.outputName} · ${Math.round(s.inputRate)} → ${Math.round(s.outputRate)} Hz`
    : 'engine stopped') + (s.shifter ? ` · ${s.shifter}` : '');
  $('err-row').hidden = !s.error;
  $('err').textContent = s.error || '';

  updateReadout(s);

  const first = cfg === null;
  const c = s.config;
  // never fight the user's hand: a drag-paint in progress owns the mask
  if (first || (Date.now() > dirtyUntil && !painting)) {
    const structural = !cfg || cfg.edo !== c.edo || cfg.rootNote !== c.rootNote
      || cfg.rootCents !== c.rootCents || cfg.stretchCents !== c.stretchCents
      || cfg.toleranceCents !== c.toleranceCents
      || JSON.stringify(cfg.degrees) !== JSON.stringify(c.degrees);
    if (lastRange !== null && lastRange !== c.range)
      showToast(`Engine restarted — detection range is now ${c.range}`);
    lastRange = c.range;
    cfg = c;
    degrees = c.degrees.slice();
    setControls(c);
    if (first) {
      loadDevices(); rebuildChips(); rebuildPresetList(); buildRuler();
      podEls.forEach(p => rebuildIntervalOptions(p.sel));
    }
    else if (structural) {
      rebuildChips(); buildRuler(); rebuildPresetList();
      podEls.forEach(p => rebuildIntervalOptions(p.sel)); // pool follows the EDO
    }
    else updateRulerState();
    syncHarm();
  }
}

function setControls(c) {
  if (document.activeElement !== $('edo')) $('edo').value = c.edo;
  $('edo-btn').innerHTML = `${c.edo}-EDO &#9662;`;
  $('root').value = c.rootNote;
  if (document.activeElement !== $('root-cents')) $('root-cents').value = c.rootCents;
  if (document.activeElement !== $('a4')) $('a4').value = c.refA4;
  $('stretch').value = c.stretchCents;
  $('stretch-val').textContent = `${c.stretchCents >= 0 ? '+' : ''}${c.stretchCents.toFixed(1)} ¢/oct`;
  // echo-back guard: never overwrite a knob whose inline editor is open
  const knobSync = (k, v) => {
    if (!$(`kval-${k.id}`).querySelector('input')) knobSet(k, v, false);
  };
  knobSync(KNOBS[0], c.retuneMs);
  knobSync(KNOBS[1], Math.round(c.amount * 100));
  knobSync(KNOBS[2], c.toleranceCents);
  knobSync(KNOBS[3], Math.round(c.stickiness * 100));
  knobSync(KNOBS[4], c.transitionMs);
  knobSync(KNOBS[5], Math.round(c.humanize * 100));
  $('range').value = c.range;
  $('quality').value = c.quality;
  // Harmony intervals are the demanding case for the phase vocoder: on low
  // voices they only land accurately with the biggest analysis block.
  const harmActive = c.harmOn && c.hm.some(x => x);
  const note = $('quality-note');
  note.hidden = !(harmActive && c.quality !== 'high');
  if (!note.hidden)
    note.firstElementChild.textContent =
      'Harmony voices are most in-tune at High quality — below it, low ' +
      'voices can drift sharp by tens of cents. Correction itself is ' +
      'accurate at every setting.';
  $('midi-mode').classList.toggle('on', !!c.midiMode);
  if ($('midi-src').value !== (c.midiSource || '')) $('midi-src').value = c.midiSource || '';
  $('gain').value = c.outputGainDb;
  $('gain-val').textContent = `${c.outputGainDb.toFixed(1)} dB`;
  $('bypass').classList.toggle('on', c.bypass);
  $('bufsize').value = String(c.bufferFrames);
  if ($('in-dev').value !== (c.inputUid || '')) $('in-dev').value = c.inputUid || '';
  if ($('out-dev').value !== (c.outputUid || '')) $('out-dev').value = c.outputUid || '';
}

// ---- status stream ---------------------------------------------------------
// The clock lives in the server; the UI renders from its pushed frames and
// polls nothing while the socket is up. A frozen display flagged offline is
// a true reading; one animating off a dead engine would be a lie.
let lastStatusAt = 0;
let offline = false;
let pollFallbackTimer = null;

function noteAlive() { lastStatusAt = performance.now(); }

function setOfflineState(off) {
  if (off === offline) return;
  offline = off;
  document.body.classList.toggle('offline', off);
  if (off) {
    $('dot').classList.remove('ok');
    $('lat').textContent = 'offline';
    $('lat').classList.add('bad');
    $('needle').style.display = 'none';
    showToast('Lost the engine — reconnecting');
  }
}
setInterval(() => setOfflineState(performance.now() - lastStatusAt > 1500), 400);

function startPollFallback() { // only while the socket is down
  if (pollFallbackTimer) return;
  pollFallbackTimer = setInterval(async () => {
    try {
      const r = await fetch('/api/status');
      noteAlive();
      applyStatus(await r.json());
    } catch (e) {}
  }, 500);
}
function stopPollFallback() {
  clearInterval(pollFallbackTimer);
  pollFallbackTimer = null;
}

function connectWs() {
  let ws;
  try { ws = new WebSocket(`ws://${location.host}/ws`); }
  catch (e) { setTimeout(connectWs, 1000); return; }
  ws.onopen = () => stopPollFallback();
  ws.onmessage = ev => {
    noteAlive();
    try { applyStatus(JSON.parse(ev.data)); } catch (e) {}
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onclose = () => {
    startPollFallback();
    setTimeout(connectWs, 1000);
  };
}

startPollFallback(); // covers the gap until the socket opens (and old browsers)
connectWs();
loadScales();
</script>
</body>
</html>
